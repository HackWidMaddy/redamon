# Expected graph state after a full recon of each scenario project, once nested
# wildcards ship (scan roots below the org, one Domain per org). Asserted by
# validate_nested_wildcards.py through the inbound MCP server (query_graph).
#
# Every check is one read-only Cypher returning a column `v` (or, with
# `recon_json: <dotted.path>`, the keys or items at that path of the run's recon
# JSON), and one assertion:
#   equals    the set of v equals the list
#   superset  the set of v contains every item
#   disjoint  the set of v contains none of the items
#   true      exactly one row, v is true
#   count     the number of rows equals the integer
#
# Lab limitations (README "Lab limitations") shape these expectations: no brute
# force, so an ENUMERATE group discovers only through the certificate SANs of a
# probed host (its scan root with Root on, or a seed) and through app.js. Hence
# dev.eu.corp is never expected, and U5/U8 carry one seed host each. The host's
# systemd-resolved answers SERVFAIL to every DNSKEY query (DNSSEC off), which the
# DNSSEC check reads as "unknown", so no dnssec_missing finding is expected.

lab_settings: &lab
  masscanEnabled: false
  naabuEnabled: false
  purednsEnabled: false
  useBruteforceForSubdomains: false
  knockpyReconEnabled: false
  crtshEnabled: false
  hackerTargetEnabled: false
  subfinderEnabled: false
  shodanEnabled: false
  urlscanEnabled: false
  otxEnabled: false
  httpxProbeTlsInfo: false
  jsReconEnabled: true
  jsReconDependencyCheck: false

common_checks: &common
  - id: no_stray_domain_for_a_deeper_scan_root
    cypher: "MATCH (d:Domain) WHERE d.name IN ['api.nwlab.test','eu.corp.nwlab.test','api.nwlab-two.test','portal.nwlab-two.test'] RETURN d.name AS v"
    count: 0
  - id: every_subdomain_links_to_one_domain
    cypher: "MATCH (s:Subdomain) OPTIONAL MATCH (s)-[:BELONGS_TO]->(d:Domain) WITH s, count(d) AS n WHERE n <> 1 RETURN s.name AS v"
    count: 0

scenarios:
  U3:
    title: NW-Batch, four groups across two orgs
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - api.nwlab.test
        - v1.api.nwlab.test
        - www.nwlab.test
        - a.b.c.d.nwlab.test
        - "*.dev.eu.corp.nwlab.test"
        - "*.eu.corp.nwlab.test"
        - "*.nwlab-two.test"
        - nwlab-two.test
      settings: *lab
    checks:
      - id: domains_are_the_orgs
        cypher: "MATCH (d:Domain) RETURN d.name AS v"
        equals: [nwlab.test, nwlab-two.test]
      - id: api_is_a_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) RETURN coalesce(s.is_scan_root, false) AS v"
        "true": true
      - id: api_scan_root_is_scanned_root_on
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test]
      # The lab has no brute force, and a certificate SAN name is recorded but
      # not probed (R1 scans only its root on the base code too), so a group
      # scans its root (Root on) and its seed host.
      - id: group1_root_and_seed_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test, v1.api.nwlab.test]
      - id: group2_exact_hosts_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [www.nwlab.test, a.b.c.d.nwlab.test]
      - id: group2_siblings_and_apex_not_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [nwlab.test, shop.nwlab.test, mail.nwlab.test, secret.nwlab.test, cdn.nwlab.test]
      - id: group4_root_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [nwlab-two.test]
      - id: group3_root_off_not_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [eu.corp.nwlab.test]
      - id: org_dns_findings_once_per_org
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing','zone_transfer'] RETURN d.name + '|' + v.type AS v"
        equals: ["nwlab-two.test|spf_missing", "nwlab-two.test|dmarc_missing"]
      - id: org_dns_findings_not_duplicated
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing','zone_transfer'] RETURN v.id AS v"
        count: 2
      - id: coverage_stamped_on_both_orgs
        cypher: "MATCH (d:Domain) WHERE d.recon_coverage_at IS NOT NULL RETURN d.name AS v"
        equals: [nwlab.test, nwlab-two.test]
      - id: coverage_roots_merged_per_org
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) UNWIND coalesce(d.recon_coverage_roots, []) AS r RETURN r AS v"
        equals: [api.nwlab.test, nwlab.test, eu.corp.nwlab.test]
    common: true

  M6:
    title: NW-Batch created through MCP create_project; the same graph as U3
    same_as: U3

  U5:
    title: NW-Owner, ownership TXT at the org or at the scan root
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - v1.api.nwlab.test
        - "*.api.nwlab-two.test"
        - v1.api.nwlab-two.test
        - "*.portal.nwlab-two.test"
        - www.nwlab-two.test
      settings:
        <<: *lab
        verifyDomainOwnership: true
        ownershipToken: nwlab-token
    checks:
      - id: passing_groups_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [v1.api.nwlab.test, v2.api.nwlab.test, v1.api.nwlab-two.test, v2.api.nwlab-two.test]
      - id: refused_groups_scan_nothing
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [portal.nwlab-two.test, www.nwlab-two.test, nwlab-two.test, api.nwlab.test, api.nwlab-two.test]
    common: true

  U6:
    title: NW-Deep, single-domain target below the org
    create:
      targetDomain: api.nwlab.test
      subdomainList: ["."]
      settings: *lab
    checks:
      - id: one_domain_the_org
        cypher: "MATCH (d:Domain) RETURN d.name AS v"
        equals: [nwlab.test]
      - id: target_is_a_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) RETURN coalesce(s.is_scan_root, false) AS v"
        "true": true
      - id: coverage_on_the_org
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN d.recon_coverage_at IS NOT NULL AS v"
        "true": true
      - id: dns_checks_find_nothing_on_the_clean_org
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing'] RETURN d.name + '|' + v.type AS v"
        count: 0
      - id: discovered_under_the_target
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test, v1.api.nwlab.test, v2.api.nwlab.test]
      - id: nothing_outside_the_target_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [nwlab.test, www.nwlab.test, shop.nwlab.test, mail.nwlab.test, secret.nwlab.test]
    common: true

  U7:
    title: NW-Exact, single domain with dotted prefixes
    create:
      targetDomain: nwlab.test
      subdomainList: [www., v1.api., a.b.c.d.]
      settings: *lab
    checks:
      - id: exactly_the_listed_hosts
        cypher: "MATCH (b:BaseURL) WHERE b.host ENDS WITH 'nwlab.test' RETURN DISTINCT b.host AS v"
        equals: [www.nwlab.test, v1.api.nwlab.test, a.b.c.d.nwlab.test]
    common: true

  U8:
    title: NW-NoRoot, a wildcard without its own name
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - v1.api.nwlab.test
      settings: *lab
    checks:
      - id: scan_root_never_probed
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [api.nwlab.test, nwlab.test]
      - id: no_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) WHERE coalesce(s.is_scan_root, false) RETURN s.name AS v"
        count: 0
      - id: its_subdomains_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [v1.api.nwlab.test, v2.api.nwlab.test, admin.v1.api.nwlab.test, internal.v1.api.nwlab.test]
    common: true

  VH:
    title: >-
      vhost/SNI on web1 (plan 07): every nwlab.test name DNS points at
      192.88.99.60 serves its own page there, and none is a hidden vhost; the
      one name web1 serves with no DNS record still is
    create:
      # Every discovery source is off in this lab, so the hosts are listed: eight
      # names web1 serves with DNS, and vhost-only, which no zone has. In an
      # exact scope vhost/SNI tries listed names only, hence the full name in
      # its custom wordlist. Nine names, not more: web1's pages differ only by
      # the hostname they print, which the canonical fingerprint normalises
      # away, so from ten candidates up the noisy-frontend guard reads them as
      # one catch-all template and drops every anomaly before this rule runs.
      targetDomain: nwlab.test
      subdomainList: [www, shop, mail, secret, cdn, api, v1.api, v2.api, vhost-only]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, vuln_scan]
        vhostSniEnabled: true
        vhostSniTestL7: true
        vhostSniTestL4: true
        vhostSniUseGraphCandidates: true
        vhostSniUseDefaultWordlist: false
        vhostSniCustomWordlist: vhost-only.nwlab.test
        vhostSniInjectDiscovered: true
        # web1's pages differ from its default page by a few bytes only
        vhostSniBaselineSizeTolerance: 0
    checks:
      - id: no_dns_known_name_is_a_finding
        cypher: "MATCH (v:Vulnerability {source:'vhost_sni_enum'}) WHERE v.hostname <> 'vhost-only.nwlab.test' RETURN v.hostname AS v"
        count: 0
      - id: the_name_with_no_dns_is_a_hidden_vhost
        cypher: "MATCH (v:Vulnerability {source:'vhost_sni_enum'}) RETURN v.name AS v"
        equals: ["Hidden Virtual Host: vhost-only.nwlab.test"]
      - id: dns_known_names_were_probed_and_set_aside
        cypher: "MATCH (i:IP {address:'192.88.99.60'}) RETURN coalesce(i.vhost_sni_suppressed_dns_known, 0) >= 5 AS v"
        "true": true
      - id: no_dns_known_subdomain_flagged_hidden
        cypher: "MATCH (s:Subdomain) WHERE s.vhost_hidden = true AND s.name <> 'vhost-only.nwlab.test' RETURN s.name AS v"
        count: 0
      - id: only_the_hidden_name_is_injected
        cypher: "MATCH (b:BaseURL) WHERE b.discovery_source = 'vhost_sni_enum' RETURN b.host AS v"
        equals: ["vhost-only.nwlab.test"]
    common: true

  WC:
    title: >-
      Wildcard DNS under a scan root (plan 08.3): *.wild.nwlab.test answers every
      name with web1, real.wild.nwlab.test has its own record on web2. The lab has
      no brute force, so the names arrive the way the lab discovers: the
      certificate web1 serves for wild.nwlab.test names four hosts that exist only
      through the wildcard, and real.wild. RedAmon's wildcard control (puredns is
      off here, as in every lab project) keeps real.wild and drops the other four.
    create:
      domainBatchHosts:
        - "*.wild.nwlab.test"
        - wild.nwlab.test
      settings: *lab
    checks:
      - id: the_zone_is_stamped_as_a_wildcard
        cypher: "MATCH (s:Subdomain {name:'wild.nwlab.test'}) RETURN s.is_wildcard_zone AS v"
        "true": true
      - id: the_wildcard_answers_with_web1
        cypher: "MATCH (s:Subdomain {name:'wild.nwlab.test'}) UNWIND coalesce(s.wildcard_ips, []) AS ip RETURN ip AS v"
        equals: [192.88.99.60]
      - id: wildcard_only_names_are_no_subdomain
        cypher: "MATCH (s:Subdomain) RETURN s.name AS v"
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      - id: wildcard_only_names_are_never_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      # A certificate name merged after httpx becomes a scan target, not a
      # Subdomain node, unless tlsx or vhost/SNI writes it (neither runs here).
      # So the two checks above hold even without the control; these two, on
      # the run's own target list, are the ones that tell kept from dropped.
      - id: the_name_with_its_own_record_is_a_target
        recon_json: dns.subdomains
        superset: [wild.nwlab.test, real.wild.nwlab.test]
      - id: wildcard_only_names_are_no_target
        recon_json: dns.subdomains
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      - id: a_checked_zone_is_no_coverage_gap
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'wildcard_control' AS v"
        equals: [false]
    common: true

  WC-DNSOFF:
    title: >-
      The WC hosts with DNS resolution off (plan 08.1 and 08.3): nothing is
      resolved, so nothing reads as resolved, and the wildcard control does not
      run, so no zone is stamped. In this lab nothing is probed either (httpx
      gets no target without DNS), so no certificate name reaches the control
      unchecked and no wildcard_control coverage gap is due; that note is
      unit-tested (recon/tests/test_wildcard_control.py).
    create:
      domainBatchHosts:
        - "*.wild.nwlab.test"
        - wild.nwlab.test
      settings:
        <<: *lab
        dnsEnabled: false
    checks:
      - id: no_domain_is_a_checked_zone
        cypher: "MATCH (d:Domain) WHERE d.is_wildcard_zone IS NOT NULL RETURN d.name AS v"
        count: 0
      - id: no_subdomain_is_a_checked_zone
        cypher: "MATCH (s:Subdomain) WHERE s.is_wildcard_zone IS NOT NULL RETURN s.name AS v"
        count: 0
      - id: no_subdomain_reads_as_resolved
        cypher: "MATCH (s:Subdomain) WHERE s.status = 'resolved' RETURN s.name AS v"
        count: 0
      - id: no_subdomain_resolves_to_an_ip
        cypher: "MATCH (s:Subdomain)-[:RESOLVES_TO]->(i:IP) RETURN s.name AS v"
        count: 0
      - id: nothing_went_in_unchecked
        recon_json: dns.subdomains
        count: 0
      - id: so_no_wildcard_gap_is_due
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'wildcard_control' AS v"
        equals: [false]
    common: true
