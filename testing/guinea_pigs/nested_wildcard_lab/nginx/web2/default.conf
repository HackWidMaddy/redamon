# web2 (192.88.99.61): every nwlab-two.test vhost, on 80 and 443.
ssl_certificate     /etc/nginx/certs/web2.crt;
ssl_certificate_key /etc/nginx/certs/web2.key;

# The body names the vhost from this fixed map, never from $host itself (see web1).
map $host $nwlab_page {
    default                "unknown-vhost";
    nwlab-two.test         "nwlab-two.test";
    www.nwlab-two.test     "www.nwlab-two.test";
    portal.nwlab-two.test  "portal.nwlab-two.test";
    api.nwlab-two.test     "api.nwlab-two.test";
    v1.api.nwlab-two.test  "v1.api.nwlab-two.test";
    v2.api.nwlab-two.test  "v2.api.nwlab-two.test";
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>$nwlab_page</title></head><body><h1>$nwlab_page</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}
