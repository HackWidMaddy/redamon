; php2shell target profile (matches the public PoC "bookworm" requirements).
display_errors = On
memory_limit = 8M

; Body/upload caps stay above the 12 MB OOM field so it reaches PHP and then
; trips the 8 MB memory_limit, rather than being rejected at the body boundary.
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 1000

; Session knobs the exploit relies on. upload_progress.enabled is already the
; upstream default; it is spelled out here so the lab is self-documenting.
session.use_cookies = 1
session.use_strict_mode = 0
session.upload_progress.enabled = 1
